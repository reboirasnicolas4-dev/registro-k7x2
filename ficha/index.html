<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de ingreso – Alas de Libertad</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7a823">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ficha ingreso">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --naranja:#b8303d; --naranja-claro:#fbecee; --marron:#1f1c1c;
    --tinta:#2b211b; --gris:#7a6f68; --linea:#e6dcd3; --fondo:#faf6f2; --blanco:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer}
  .app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 24px}
  header.top{padding:16px 0 10px;display:flex;align-items:center;gap:10px}
  .marca{font-family:Lora,serif;font-weight:700;color:var(--marron);font-size:19px;line-height:1.1}
  .marca small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:var(--gris);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  .top .sp{flex:1}
  .top .volver{text-decoration:none;white-space:nowrap;font-size:22px;line-height:1;padding-left:14px;padding-right:14px}
  .btn-sec{background:var(--blanco);border:1px solid var(--linea);color:var(--marron);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
  .barra{height:6px;background:var(--linea);border-radius:99px;overflow:hidden;margin:4px 0 6px}
  .barra i{display:block;height:100%;background:var(--naranja);width:0;transition:width .25s}
  .seccion{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--naranja);text-transform:uppercase;display:flex;justify-content:space-between}
  .seccion span:last-child{color:var(--gris);font-weight:500;letter-spacing:0}
  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:22px 18px;margin-top:12px;box-shadow:0 2px 10px rgba(107,58,31,.05)}
  .pregunta{font-size:23px;font-weight:700;line-height:1.25;margin:0 0 6px}
  .etiqueta{font-size:13px;color:var(--gris);margin:0 0 18px}
  .lectura{background:var(--naranja-claro);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:15px;line-height:1.5}
  .lectura ul{margin:6px 0 0;padding-left:20px}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea{
    width:100%;font:inherit;font-size:18px;padding:14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);outline:none}
  input:focus,textarea:focus{border-color:var(--naranja)}
  textarea{min-height:120px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{border:1px solid var(--linea);background:var(--fondo);border-radius:99px;padding:8px 14px;font-size:15px;color:var(--tinta)}
  .opciones{display:flex;flex-direction:column;gap:10px}
  .op{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--linea);background:#fff;border-radius:14px;padding:15px 16px;font-size:18px;font-weight:500;color:var(--tinta)}
  .op .cuad{width:24px;height:24px;border:2px solid #b9aca2;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700}
  .op.on{border-color:var(--naranja);background:var(--naranja-claro)}
  .op.on .cuad{background:var(--naranja);border-color:var(--naranja)}
  .otro{margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:18px}
  .nav button{flex:1;border-radius:14px;padding:15px;font-size:17px;font-weight:600;border:1.5px solid var(--linea);background:#fff;color:var(--marron)}
  .nav .sig{background:var(--naranja);border-color:var(--naranja);color:#fff;flex:2}
  .saltar{display:block;margin:12px auto 0;background:none;border:none;color:var(--gris);font-size:14px;text-decoration:underline}
  .hint{font-size:13px;color:var(--gris);margin-top:10px}
  /* índice */
  .panel{position:fixed;inset:0;background:rgba(43,33,27,.45);display:none;z-index:20}
  .panel.open{display:block}
  .panel .hoja{position:absolute;right:0;top:0;bottom:0;width:min(420px,92vw);background:#fff;overflow:auto;padding:18px}
  .panel h3{font-family:Lora,serif;color:var(--marron);margin:4px 0 12px}
  .idx-sec{font-size:12px;font-weight:700;color:var(--naranja);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px}
  .idx{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--linea);padding:10px 2px;font-size:15px;color:var(--tinta)}
  .idx em{font-style:normal;color:var(--gris);font-size:13px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idx em.ok{color:#2f7d4f}
  /* final */
  .acciones{display:flex;flex-direction:column;gap:10px;margin:14px 0}
  .acciones button{border-radius:14px;padding:15px;font-size:17px;font-weight:600;border:1.5px solid var(--linea);background:#fff;color:var(--marron)}
  .acciones .pdf{background:var(--naranja);border-color:var(--naranja);color:#fff}
  .msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--naranja-claro);display:none}
  .msg.show{display:block}
  .confirm{display:none;background:#fff;border:1.5px solid var(--naranja);border-radius:14px;padding:14px;font-size:15px}
  .confirm.show{display:block}
  .confirm .fila{display:flex;gap:8px;margin-top:10px}
  .confirm button{flex:1;border-radius:10px;padding:11px;font-weight:600;border:1px solid var(--linea);background:#fff}
  .confirm .si{background:var(--marron);color:#fff;border-color:var(--marron)}
  .hoja-ficha{display:block;width:100%;height:auto;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.12);margin:0 0 14px;border-radius:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top no-print">
    <a class="btn-sec volver" href="../" aria-label="Volver a Internos" title="Volver a Internos">‹</a>
    <div class="marca">“Alas de Libertad”<small>Ficha de ingreso</small></div>
    <div class="sp"></div>
    <button class="btn-sec" id="btnIndice">Preguntas</button>
    <button class="btn-sec" id="btnVer">Ver ficha</button>
  </header>
  <main id="vista"></main>
</div>

<div class="panel no-print" id="panel">
  <div class="hoja">
    <div style="display:flex;align-items:center"><h3 style="flex:1">Todas las preguntas</h3><button class="btn-sec" id="cerrarPanel">Cerrar</button></div>
    <div id="indice"></div>
  </div>
</div>

  {s:3,k:"diagnostico",tipo:"area",label:"Diagnóstico principal (si corresponde)",ask:"¿Tenés un diagnóstico principal?"},
  {s:3,k:"abstinencia",tipo:"text",label:"Tiempo de abstinencia al momento del ingreso",ask:"¿Cuánto tiempo llevás sin consumir?",chips:["1 semana","15 días","1 mes","2 meses","3 meses","6 meses"]},

  {s:4,k:"cronicas",tipo:"choice",label:"¿Presenta enfermedades crónicas?",ask:"¿Tenés alguna enfermedad crónica?",ops:["Sí","No"]},
  {s:4,k:"cronicasDetalle",tipo:"area",label:"En caso afirmativo, especifique",ask:"¿Cuál o cuáles?",si:d=>d.cronicas==="Sí"},
  {s:4,k:"tratMedico",tipo:"choice",label:"¿Se encuentra bajo tratamiento médico?",ask:"¿Estás bajo tratamiento médico?",ops:["Sí","No"]},
  {s:4,k:"medicacion",tipo:"area",label:"Medicación actual (nombre y dosis)",ask:"¿Qué medicación tomás? Nombre y dosis"},
  {s:4,k:"prestador",tipo:"choice",label:"Prestador de salud (ASSE / IAMC / Otro)",ask:"¿Cuál es tu prestador de salud?",ops:["ASSE","IAMC","Otro"],otro:"prestadorOtro"},
  {s:4,k:"medico",tipo:"text",label:"Médico de referencia (si posee)",ask:"¿Tenés un médico de referencia?"},

  {s:5,k:"convivencia",tipo:"choice",label:"Convivencia previa al ingreso",ask:"Antes de ingresar, ¿con quién vivías?",ops:["Solo/a","Familia","Pareja","Otro"],otro:"convivenciaOtro"},
  {s:5,k:"vinculoFam",tipo:"choice",label:"Vínculo familiar actual",ask:"¿Cómo es hoy el vínculo con tu familia?",ops:["Bueno","Regular","Escaso","Inexistente"]},
  {s:5,k:"redApoyo",tipo:"area",label:"Red de apoyo identificada",ask:"¿Quiénes te apoyan en este proceso?"},

  {s:6,k:"nivel",tipo:"choice",label:"Nivel educativo alcanzado",ask:"¿Hasta dónde estudiaste?",ops:["Primaria","Secundaria","Terciaria","Universitaria"]},
  {s:6,k:"nivelInc",tipo:"choice",label:"Nivel educativo: ¿completo o incompleto?",ask:"¿Lo terminaste completo?",ops:["Completo","Incompleto"]},
  {s:6,k:"laboral",tipo:"choice",label:"Situación laboral actual",ask:"¿Cuál es tu situación laboral hoy?",ops:["Desempleado/a","Empleado/a","Trabajo informal","Estudiante"]},
  {s:6,k:"oficio",tipo:"area",label:"Oficio o experiencia laboral",ask:"¿Qué oficio o experiencia de trabajo tenés?"},

  {s:7,k:"compromiso",tipo:"choice",label:"Compromisos del residente",ask:"¿Aceptás estos compromisos?",ops:["Acepta","No acepta"],lectura:true},

  {s:8,k:"observaciones",tipo:"area",label:"Observaciones del equipo",ask:"Observaciones del equipo",hint:"Esto lo completa el equipo, no se le pregunta al residente."},
];

const COMPROMISOS = [
  "El reglamento interno de convivencia.",
  "Las normas sobre salidas, horarios y conductas esperadas.",
  "La prohibición del consumo de sustancias psicoactivas dentro y fuera del dispositivo.",
  "La participación activa en las actividades propuestas."
];

/* ---------- Estado ---------- */
const CLAVE = "alas_ficha_ingreso_borrador";
let D = {};
let paso = 0;
let modo = "preguntas"; // o "ficha"

function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify({D, paso})); }catch(e){} }
function cargar(){
  try{ const r = JSON.parse(localStorage.getItem(CLAVE)||"null"); if(r && r.D){ D=r.D; paso=Math.min(r.paso||0,Q.length-1); return true; } }catch(e){}
  return false;
}
function aplicarDefaults(q){
  if(q.def && (D[q.k]===undefined || D[q.k]==="")){
    const v = typeof q.def==="function" ? q.def(D) : q.def;
    if(v) D[q.k]=v;
  }
}
function visible(q){ return !q.si || q.si(D); }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtFecha(iso){ if(!iso) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m? m[3]+"/"+m[2]+"/"+m[1] : iso; }
function val(k){ const v=D[k]; if(Array.isArray(v)) return v; return (v==null?"":String(v)).trim(); }
function resumen(q){
  const v=D[q.k];
  if(v==null || v==="" || (Array.isArray(v)&&!v.length)) return "";
  if(q.tipo==="date") return fmtFecha(v);
  if(Array.isArray(v)) return v.join(", ");
  return String(v);
}

/* ---------- Pantalla de preguntas ---------- */
function render(){
  $("#btnVer").textContent = modo==="ficha" ? "Volver" : "Ver ficha";
  if(modo==="ficha") return renderFicha();
  const q = Q[paso];
  aplicarDefaults(q);
  const visibles = Q.filter(visible);
  const pos = visibles.indexOf(q)+1;
  const v = D[q.k];
  let h = `<div class="barra"><i style="width:${Math.round(pos/visibles.length*100)}%"></i></div>
    <div class="seccion"><span>${esc(SECCIONES[q.s])}</span><span>${pos} de ${visibles.length}</span></div>
    <div class="card">
      <p class="pregunta">${esc(q.ask)}</p>
      <p class="etiqueta">En la ficha: ${esc(q.label)}</p>`;
  if(q.lectura){
    h += `<div class="lectura">Leerle al residente: <b>Declaro conocer y aceptar:</b><ul>${COMPROMISOS.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`;
  }
  if(q.tipo==="choice" || q.tipo==="multi"){
    const sel = q.tipo==="multi" ? (Array.isArray(v)?v:[]) : [v];
    h += `<div class="opciones">` + q.ops.map((o,i)=>{
      const on = sel.includes(o);
      return `<button class="op ${on?"on":""}" data-op="${i}"><span class="cuad">${on?"✓":""}</span>${esc(o)}</button>`;
    }).join("") + `</div>`;
    if(q.otro && sel.includes("Otro")){
      h += `<div class="otro"><input type="text" id="otro" placeholder="Especificar…" value="${esc(D[q.otro]||"")}"></div>`;
    }
  } else if(q.tipo==="area"){
    h += `<textarea id="inp" placeholder="Escribí acá…">${esc(v||"")}</textarea>`;
  } else {
    const t = q.tipo==="text" ? "text" : q.tipo;
    h += `<input id="inp" type="${t}" ${q.num?'inputmode="numeric"':''} autocomplete="off" value="${esc(v||"")}" placeholder="${q.tipo==="date"?"":"Escribí acá…"}">`;
    if(q.chips) h += `<div class="chips">${q.chips.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  }
  if(q.hint) h += `<p class="hint">${esc(q.hint)}</p>`;
  const ultimo = siguienteIndice(paso)===-1;
  h += `<div class="nav">
      <button id="ant" ${anteriorIndice(paso)===-1?"disabled style='opacity:.4'":""}>Anterior</button>
      <button id="sig" class="sig">${ultimo?"Terminar y ver ficha":"Siguiente"}</button>
    </div>
    <button class="saltar" id="saltar">Dejar en blanco y seguir</button>
  </div>`;
  $("#vista").innerHTML = h;

  const inp = $("#inp");
  if(inp){
    inp.addEventListener("input", ()=>{ D[q.k]=inp.value; guardar(); });
    if(q.tipo!=="date") setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && q.tipo!=="area"){ e.preventDefault(); avanzar(); } });
  }
  document.querySelectorAll("[data-chip]").forEach(b=>b.addEventListener("click",()=>{
    D[q.k]=b.dataset.chip; guardar(); avanzar();
  }));
  document.querySelectorAll("[data-op]").forEach(b=>b.addEventListener("click",()=>{
    const o = q.ops[+b.dataset.op];
    if(q.tipo==="multi"){
      const arr = Array.isArray(D[q.k])?D[q.k].slice():[];
      const i = arr.indexOf(o); if(i>=0) arr.splice(i,1); else arr.push(o);
      D[q.k]=arr; guardar(); render();
    } else {
      D[q.k] = (D[q.k]===o) ? "" : o; guardar();
      if(D[q.k] && !(q.otro && o==="Otro")) avanzar(); else render();
    }
  }));
  const otro = $("#otro");
  if(otro){ otro.addEventListener("input",()=>{ D[q.otro]=otro.value; guardar(); }); setTimeout(()=>{ try{otro.focus({preventScroll:true});}catch(e){} },60); }
  $("#sig").addEventListener("click", avanzar);
  $("#ant").addEventListener("click", ()=>{ const i=anteriorIndice(paso); if(i>=0){ paso=i; guardar(); render(); } });
  $("#saltar").addEventListener("click", ()=>{ if(q.tipo!=="multi" && q.tipo!=="choice") D[q.k]=""; avanzar(); });
  window.scrollTo(0,0);
}
function siguienteIndice(i){ for(let j=i+1;j<Q.length;j++) if(visible(Q[j])) return j; return -1; }
function anteriorIndice(i){ for(let j=i-1;j>=0;j--) if(visible(Q[j])) return j; return -1; }
function avanzar(){
  const j = siguienteIndice(paso);
  if(j===-1){ modo="ficha"; guardar(); render(); return; }
  paso=j; guardar(); render();
}

/* ---------- Índice ---------- */
function renderIndice(){
  let h="", sAct=-1;
  Q.forEach((q,i)=>{
    if(!visible(q)) return;
    if(q.s!==sAct){ sAct=q.s; h+=`<div class="idx-sec">${esc(SECCIONES[q.s])}</div>`; }
    const r = resumen(q);
    h += `<button class="idx" data-ir="${i}"><span>${esc(q.label)}</span><em class="${r?"ok":""}">${r?esc(r):"—"}</em></button>`;
  });
  $("#indice").innerHTML=h;
  document.querySelectorAll("[data-ir]").forEach(b=>b.addEventListener("click",()=>{
    paso=+b.dataset.ir; modo="preguntas"; guardar(); $("#panel").classList.remove("open"); render();
  }));
}

/* ---------- Ubicación de cada respuesta sobre la ficha original (puntos PDF, A4) ---------- */
function layout(medir){
  const ops=[];
  const txt=(p,x,y,s,str)=>ops.push({p,t:"text",x,y,s,str});
  const fld=(p,x,y,w,str,blanco)=>{
    if(!str) return;
    let s=11; while(s>6.5 && medir(str,s)>w) s-=0.5;
    if(blanco) ops.push({p,t:"rect",x:x-3,y:y-10,w:86,h:13});
    txt(p,x,y,s,str);
  };
  const envolver=(str,s,slots)=>{
    const pal=str.replace(/\s+/g," ").trim().split(" ");
    const out=[]; let i=0;
    for(const sl of slots){
      let l="";
      while(i<pal.length){
        const prueba = l? l+" "+pal[i] : pal[i];
        if(medir(prueba,s)<=sl[2]){ l=prueba; i++; } else break;
      }
      out.push(l);
      if(i>=pal.length) return out;
    }
    return null;
  };
  const area=(p,slots,str)=>{
    if(!str) return;
    let lineas=null, s=11;
    for(s=11;s>=6;s-=0.5){ lineas=envolver(str,s,slots); if(lineas) break; }
    if(!lineas){ s=6; lineas=envolver(str.slice(0,300),6,slots)||[str.slice(0,110)]; }
    lineas.forEach((l,i)=>{ if(l) txt(p,slots[i][0],slots[i][1],s,l); });
  };
  const box=(p,x,y,on)=>{ if(on) ops.push({p,t:"x",cx:x+4.9,cy:y+8.4}); };
  const F=k=>fmtFecha(val(k));

  // Página 1
  fld(1,431,121.6,80,F("fecha"));
  fld(1,298,235.8,210,F("fechaIngreso"));
  fld(1,218,320.9,292,val("nombre"));
  fld(1,224,334.7,286,val("cedula"));
  fld(1,227,348.5,283,F("nacimiento"));
  fld(1,192,362.3,318,val("nacionalidad"));
  fld(1,185,376.1,325,val("estadoCivil"));
  fld(1,260,389.9,250,val("domicilio"));
  fld(1,229,403.7,281,val("telefono"));
  fld(1,266,414.6,244,val("correo"));
  fld(1,218,502.7,292,val("refNombre"));
  fld(1,245,516.6,265,val("refVinculo"));
  fld(1,172,530.4,338,val("refTelefono"));
  fld(1,176,544.6,334,val("refDireccion"));
  fld(1,315,587.9,195,val("institucion"));
  fld(1,236,601.7,274,val("tiempoInternacion"));
  fld(1,205,615.5,305,F("fechaEgreso"));
  const tt=Array.isArray(D.tipoTrat)?D.tipoTrat:[];
  box(1,121,645.8,tt.includes("Comunidad terapéutica"));
  box(1,121,675.2,tt.includes("Centro de rehabilitación"));
  // Página 2
  box(2,121,69.9,tt.includes("Hospital"));
  box(2,121,99.5,tt.includes("Otro"));
  if(tt.includes("Otro")) fld(2,227,109.8,283,val("tipoTratOtro"));
  area(2,[[311,140.4,199],[121,151.2,389]],val("diagnostico"));
  fld(2,352,168.0,158,val("abstinencia"));
  box(2,121,269.6,D.cronicas==="Sí"); box(2,147.4,269.6,D.cronicas==="No");
  if(D.cronicas==="Sí") area(2,[[278,310.8,232],[121,324,389],[121,337,389]],val("cronicasDetalle"));
  box(2,121,368.9,D.tratMedico==="Sí"); box(2,147.4,368.9,D.tratMedico==="No");
  area(2,[[300,410.2,210],[121,421.2,389],[121,436.6,389]],val("medicacion"));
  fld(2,328,451.8,182, D.prestador==="Otro" ? ("Otro"+(val("prestadorOtro")?": "+val("prestadorOtro"):"")) : val("prestador"));
  area(2,[[284,479.4,226],[121,490.4,389]],val("medico"));
  [121,167.9,220.7,266.8].forEach((x,i)=>box(2,x,594.6,D.convivencia===["Solo/a","Familia","Pareja","Otro"][i]));
  if(D.convivencia==="Otro") fld(2,309,607.7,201,val("convivenciaOtro"));
  [121,168.7,222.7,272.3].forEach((x,i)=>box(2,x,652.7,D.vinculoFam===["Bueno","Regular","Escaso","Inexistente"][i]));
  area(2,[[253,707.8,257],[121,721.6,389],[121,732.8,389]],val("redApoyo"));
  // Página 3
  [121,178.4,248,307.4].forEach((x,i)=>box(3,x,155.1,D.nivel===["Primaria","Secundaria","Terciaria","Universitaria"][i]));
  box(3,386.2,155.1,D.nivelInc==="Incompleto");
  [121,211,284.6,382.5].forEach((x,i)=>box(3,x,226.7,D.laboral===["Desempleado/a","Empleado/a","Trabajo informal","Estudiante"][i]));
  area(3,[[262,281.8,248],[121,296,389],[121,310,389],[121,324,389]],val("oficio"));
  box(3,85.1,535.9,D.compromiso==="Acepta"); box(3,135,535.9,D.compromiso==="No acepta");
  // Página 4
  area(4,[[85,131,425],[85,144,425],[85,157,425],[85,170,425],[85,182.5,425]],val("observaciones"));
  return ops;
}

/* ---------- Vista en pantalla (dibuja sobre la ficha original) ---------- */
const PW=595.56, PH=842.04;
const imgs={};
function cargarImg(i){
  if(imgs[i]) return imgs[i];
  imgs[i]=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=FONDOS[i-1]; });
  return imgs[i];
}
const FUENTE_CANVAS = s => `bold ${s}px "Times New Roman", Times, "Liberation Serif", "Nimbus Roman", serif`;
async function dibujarPaginas(cont){
  const lienzos=[];
  for(let i=1;i<=4;i++){
    const c=document.createElement("canvas"); c.className="hoja-ficha"; cont.appendChild(c); lienzos.push(c);
  }
  const ctxM=document.createElement("canvas").getContext("2d");
  const medir=(str,s)=>{ ctxM.font=FUENTE_CANVAS(s); return ctxM.measureText(str).width; };
  const ops=layout(medir);
  for(let i=1;i<=4;i++){
    const im=await cargarImg(i); const c=lienzos[i-1];
    const W=im?im.naturalWidth:1241, H=im?im.naturalHeight:1754, S=W/PW;
    c.width=W; c.height=H;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    if(im) ctx.drawImage(im,0,0,W,H);
    ops.filter(o=>o.p===i).forEach(o=>{
      if(o.t==="rect"){ ctx.fillStyle="#fff"; ctx.fillRect(o.x*S,o.y*S,o.w*S,o.h*S); }
      else if(o.t==="text"){ ctx.fillStyle="#111"; ctx.font=FUENTE_CANVAS(o.s*S); ctx.fillText(o.str,o.x*S,o.y*S); }
      else if(o.t==="x"){ ctx.strokeStyle="#111"; ctx.lineWidth=1.3*S; ctx.lineCap="round"; const d=3.1*S, cx=o.cx*S, cy=o.cy*S;
        ctx.beginPath(); ctx.moveTo(cx-d,cy-d); ctx.lineTo(cx+d,cy+d); ctx.moveTo(cx+d,cy-d); ctx.lineTo(cx-d,cy+d); ctx.stroke(); }
    });
  }
}
function renderFicha(){
  $("#vista").innerHTML = `
    <div class="no-print" style="margin-top:6px">
      <div class="acciones">
        <button class="pdf" id="bPdf">Descargar PDF para imprimir</button>
        <button id="bEditar">Volver a las preguntas</button>
        <button id="bNueva">Empezar ficha nueva</button>
      </div>
      <div class="confirm" id="conf">¿Borrar todos los datos de esta ficha y empezar una nueva?
        <div class="fila"><button id="cNo">Cancelar</button><button class="si" id="cSi">Sí, borrar</button></div>
      </div>
      <div class="msg" id="msg"></div>
    </div>
    <div id="hojas"></div>`;
  dibujarPaginas($("#hojas"));
  $("#bPdf").addEventListener("click", descargarPDF);
  $("#bEditar").addEventListener("click", ()=>{ modo="preguntas"; guardar(); render(); });
  $("#bNueva").addEventListener("click", ()=>$("#conf").classList.add("show"));
  $("#cNo").addEventListener("click", ()=>$("#conf").classList.remove("show"));
  $("#cSi").addEventListener("click", ()=>{ D={}; paso=0; modo="preguntas"; try{localStorage.removeItem(CLAVE);}catch(e){} render(); });
  window.scrollTo(0,0);
}
function aviso(t){ const m=$("#msg"); if(!m) return; m.textContent=t; m.classList.add("show"); }

/* ---------- PDF ---------- */
function armarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:[PW,PH]});
  doc.setFont("times","bold");
  const medir=(str,s)=>{ doc.setFontSize(s); return doc.getTextWidth(str); };
  const ops=layout(medir);
  for(let i=1;i<=4;i++){
    if(i>1) doc.addPage([PW,PH]);
    doc.addImage(FONDOS[i-1],"JPEG",0,0,PW,PH);
    ops.filter(o=>o.p===i).forEach(o=>{
      if(o.t==="rect"){ doc.setFillColor(255,255,255); doc.rect(o.x,o.y,o.w,o.h,"F"); }
      else if(o.t==="text"){ doc.setTextColor(17,17,17); doc.setFont("times","bold"); doc.setFontSize(o.s); doc.text(o.str,o.x,o.y); }
      else if(o.t==="x"){ doc.setDrawColor(17,17,17); doc.setLineWidth(1.3); doc.setLineCap("round"); const d=3.1;
        doc.line(o.cx-d,o.cy-d,o.cx+d,o.cy+d); doc.line(o.cx+d,o.cy-d,o.cx-d,o.cy+d); }
    });
  }
  return doc;
}

async function descargarPDF(){
  if(!window.jspdf){ aviso("No se pudo cargar el generador de PDF. Revisá la conexión y recargá la página."); return; }
  let doc;
  try{ doc = armarPDF(); }catch(e){ aviso("Hubo un error armando el PDF: "+e.message); return; }
  const nombre = (val("nombre")||"residente").replace(/[^\wÁÉÍÓÚáéíóúÑñ ]+/g,"").trim().replace(/\s+/g,"_");
  const archivo = "Ficha_ingreso_"+nombre+".pdf";
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl=null; }
  if(dl){
    try{
      await dl.save({filename:archivo, data:doc.output("arraybuffer")});
      aviso("Listo. El PDF quedó descargado: abrilo y mandalo a imprimir.");
    }catch(e){
      if(e && e.code==="declined") aviso("Descarga cancelada.");
      else aviso("No se pudo descargar acá ("+(e&&e.code||"error")+"). Probá abrir esta página desde claude.ai en la computadora.");
    }
  } else {
    try{ doc.save(archivo); aviso("Listo. El PDF quedó en Descargas: abrilo y mandalo a imprimir."); }
    catch(e){ aviso("No se pudo descargar el PDF: "+e.message); }
  }
}

/* ---------- Arranque ---------- */
$("#btnIndice").addEventListener("click", ()=>{ renderIndice(); $("#panel").classList.add("open"); });
$("#cerrarPanel").addEventListener("click", ()=>$("#panel").classList.remove("open"));

$("#btnVer").addEventListener("click", ()=>{ modo = modo==="ficha"?"preguntas":"ficha"; guardar(); render(); });
cargar();
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
