<style>
  :root{
    --naranja:#b8303d; --naranja-claro:#fbecee; --marron:#1f1c1c;
    --tinta:#2b211b; --gris:#7a6f68; --linea:#e6dcd3; --fondo:#faf6f2; --blanco:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer}
  .app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 24px}
  header.top{padding:16px 0 10px;display:flex;align-items:center;gap:10px}
  .marca{font-family:Lora,serif;font-weight:700;color:var(--marron);font-size:19px;line-height:1.1}
  .marca small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:var(--gris);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  .top .sp{flex:1}
  .top .volver{text-decoration:none;white-space:nowrap;font-size:22px;line-height:1;padding-left:14px;padding-right:14px}
  .btn-sec{background:var(--blanco);border:1px solid var(--linea);color:var(--marron);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
  .barra{height:6px;background:var(--linea);border-radius:99px;overflow:hidden;margin:4px 0 6px}
  .barra i{display:block;height:100%;background:var(--naranja);width:0;transition:width .25s}
  .seccion{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--naranja);text-transform:uppercase;display:flex;justify-content:space-between}
  .seccion span:last-child{color:var(--gris);font-weight:500;letter-spacing:0}
  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:22px 18px;margin-top:12px;box-shadow:0 2px 10px rgba(107,58,31,.05)}
  .pregunta{font-size:23px;font-weight:700;line-height:1.25;margin:0 0 6px}
  .etiqueta{font-size:13px;color:var(--gris);margin:0 0 18px}
  .lectura{background:var(--naranja-claro);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:15px;line-height:1.5}
  .lectura ul{margin:6px 0 0;padding-left:20px}
  .lectura p{margin:8px 0 0}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea{
    width:100%;font:inherit;font-size:18px;padding:14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);outline:none}
  input:focus,textarea:focus{border-color:var(--naranja)}
  textarea{min-height:120px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{border:1px solid var(--linea);background:var(--fondo);border-radius:99px;padding:8px 14px;font-size:15px;color:var(--tinta)}
  .opciones{display:flex;flex-direction:column;gap:10px}
  .op{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--linea);background:#fff;border-radius:14px;padding:15px 16px;font-size:18px;font-weight:500;color:var(--tinta)}
  .op .cuad{width:24px;height:24px;border:2px solid #b9aca2;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700}
  .op.on{border-color:var(--naranja);background:var(--naranja-claro)}
  .op.on .cuad{background:var(--naranja);border-color:var(--naranja)}
  .otro{margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:18px}
  .nav button{flex:1;border-radius:14px;padding:15px;font-size:17px;font-weight:600;border:1.5px solid var(--linea);background:#fff;color:var(--marron)}
  .nav .sig{background:var(--naranja);border-color:var(--naranja);color:#fff;flex:2}
  .saltar{display:block;margin:12px auto 0;background:none;border:none;color:var(--gris);font-size:14px;text-decoration:underline}
  .hint{font-size:13px;color:var(--gris);margin-top:10px}
  /* índice */
  .panel{position:fixed;inset:0;background:rgba(43,33,27,.45);display:none;z-index:20}
  .panel.open{display:block}
  .panel .hoja{position:absolute;right:0;top:0;bottom:0;width:min(420px,92vw);background:#fff;overflow:auto;padding:18px}
  .panel h3{font-family:Lora,serif;color:var(--marron);margin:4px 0 12px}
  .idx-sec{font-size:12px;font-weight:700;color:var(--naranja);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px}
  .idx{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--linea);padding:10px 2px;font-size:15px;color:var(--tinta)}
  .idx em{font-style:normal;color:var(--gris);font-size:13px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idx em.ok{color:#2f7d4f}
  /* final */
  .acciones{display:flex;flex-direction:column;gap:10px;margin:14px 0}
  .acciones button{border-radius:14px;padding:15px;font-size:17px;font-weight:600;border:1.5px solid var(--linea);background:#fff;color:var(--marron)}
  .acciones .pdf{background:var(--naranja);border-color:var(--naranja);color:#fff}
  .msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--naranja-claro);display:none}
  .msg.show{display:block}
  .confirm{display:none;background:#fff;border:1.5px solid var(--naranja);border-radius:14px;padding:14px;font-size:15px}
  .confirm.show{display:block}
  .confirm .fila{display:flex;gap:8px;margin-top:10px}
  .confirm button{flex:1;border-radius:10px;padding:11px;font-weight:600;border:1px solid var(--linea);background:#fff}
  .confirm .si{background:var(--marron);color:#fff;border-color:var(--marron)}
  .acciones .guardar{background:var(--marron);border-color:var(--marron);color:#fff}
  .acciones .guardar:disabled{opacity:.6}
  .tipoSel{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--linea);border-radius:14px;padding:8px 10px}
  .tipoSel span{font-weight:600;color:var(--marron);font-size:15px;margin-right:auto}
  .acciones .tipoSel .tp{flex:0 0 auto;padding:10px 16px;font-size:16px;border-radius:10px}
  .acciones .tipoSel .tp.on{background:var(--naranja);border-color:var(--naranja);color:#fff}
  .top .ic{font-size:18px;line-height:1;padding-left:11px;padding-right:11px}
  .nota{background:var(--naranja-claro);border:1px solid var(--naranja);color:var(--marron);border-radius:12px;padding:10px 12px;font-size:14.5px;margin:4px 0 6px}
  .lista h2{font-family:Lora,serif;color:var(--marron);font-size:24px;margin:8px 0 10px}
  .busca input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--linea);border-radius:12px;background:#fff;color:var(--tinta);outline:none}
  .busca input:focus{border-color:var(--naranja)}
  .lista .cnt{font-size:13px;color:var(--gris);margin:10px 2px}
  .lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px;margin-bottom:8px;color:var(--tinta)}
  .lrow .av{width:42px;height:42px;border-radius:50%;background:var(--fondo);border:1px solid var(--linea);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--gris);flex:none}
  .lrow .lt2{flex:1;min-width:0}.lrow b{display:block;font-size:16px}.lrow small{display:block;color:var(--gris);font-size:13px}
  .lrow em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--linea);color:var(--gris);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px}
  .lrow i{font-style:normal;color:var(--naranja);font-size:22px}
  @media (max-width:430px){header.top{gap:6px}.marca{font-size:16px}.marca small{font-size:10.5px}.btn-sec{padding:8px 9px;font-size:13.5px}.top .volver,.top .ic{padding-left:10px;padding-right:10px}}
  .hoja-ficha{display:block;width:100%;height:auto;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.12);margin:0 0 14px;border-radius:2px}

  /* ===== Estilo de la app de Internos (colores, letras y modo oscuro) ===== */
  :root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2118;--mut:#6b6157;--line:#ddd5c4;--acc:#f7a823;--accx:#281a08;--acct:#9a5a00;
    --naranja:var(--acc);--naranja-claro:color-mix(in srgb,var(--acc) 16%,var(--card));--marron:var(--ink);--tinta:var(--ink);--gris:var(--mut);--linea:var(--line);--fondo:var(--bg);--blanco:var(--card);color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#16120e;--card:#211b15;--ink:#f0e8da;--mut:#b3a99b;--line:#3a3027;--acct:#f7a823;color-scheme:dark}}
:root[data-tema=claro]{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a2118;--mut:#6b6157;--line:#ddd5c4;--acc:#f7a823;--accx:#281a08;--acct:#9a5a00;
    --naranja:var(--acc);--naranja-claro:color-mix(in srgb,var(--acc) 16%,var(--card));--marron:var(--ink);--tinta:var(--ink);--gris:var(--mut);--linea:var(--line);--fondo:var(--bg);--blanco:var(--card);color-scheme:light}
:root[data-tema=oscuro]{--bg:#16120e;--card:#211b15;--ink:#f0e8da;--mut:#b3a99b;--line:#3a3027;--acct:#f7a823;color-scheme:dark}

  html,body{font-family:"Nunito Sans",system-ui,sans-serif}
  .marca,.panel h3,.lista h2{font-family:Fraunces,Georgia,serif}
  .marca{font-size:22px;font-weight:700}
  .marca small{font-family:"Hanken Grotesk",sans-serif}
  .top .logo{width:38px;height:38px;border-radius:50%;flex:none}
  .pregunta{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
  .seccion,.idx-sec{color:var(--acct)}
  input[type=text],input[type=tel],input[type=email],input[type=date],textarea,.op,.nav button,.panel .hoja,.acciones button,.confirm,.confirm button,.tipoSel,.busca input,.lrow{background:var(--card);color:var(--ink)}
  .card{box-shadow:none}
  .op .cuad{color:var(--accx);border-color:var(--line)}
  .op.on{background:var(--naranja-claro)}
  .nav .sig,.acciones .pdf,.acciones .tipoSel .tp.on{background:var(--acc);border-color:var(--acc);color:var(--accx)}
  .acciones .guardar,.confirm .si{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .lrow i{color:var(--acct)}
  .idx em.ok{color:#2f7d4f}
  @media (prefers-color-scheme:dark){.idx em.ok{color:#7fd3a0}}
  .hoja-ficha{background:#fff}
  .inicio{display:grid;gap:12px;margin-top:6px}
  .inicio h2{font:700 24px/1.2 Fraunces,Georgia,serif;margin:4px 0 2px;color:var(--ink)}
  .big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);font:inherit;cursor:pointer}
  .big .bi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg);border:1px solid var(--line);flex:none}
  .big b{display:block;font-size:17px}.big small{display:block;font-size:13px;opacity:.8}
  .big.main{background:var(--acc);border-color:var(--acc);color:var(--accx)}.big.main .bi{background:rgba(255,255,255,.35);border-color:transparent}
  .isec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acct);margin-top:6px}
  .draft{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .draft .av{width:42px;height:42px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--mut);flex:none;font-size:14px}
  .draft .tx{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer}
  .draft .tx b{display:block;font-size:16px}.draft .tx small{display:block;color:var(--mut);font-size:13px}
  .draft .bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.draft .bar i{display:block;height:100%;background:var(--acc)}
  .draft .x{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;padding:8px}
  .okbox{background:#e3f2e8;color:#2f7d4f;border-radius:16px;padding:18px;text-align:center;display:grid;gap:6px}
  .okbox b{font:700 22px Fraunces,Georgia,serif}
  @media (prefers-color-scheme:dark){.okbox{background:#1d3326;color:#7fd3a0}}
  .btn-sec{white-space:nowrap}
  .marca{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .marca small{letter-spacing:.04em}
  .top .sp{min-width:0}
  /* En el celular: logo y título arriba; Preguntas y Ver ficha en una segunda fila, anchos */
  @media (max-width:520px){header.top{flex-wrap:wrap;row-gap:8px;gap:8px}.top .sp{display:none}.marca{flex:1 1 auto;font-size:21px}
    #btnIndice,#btnVer{order:3;flex:1 1 40%;padding:10px;font-size:15px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top no-print">
    <a class="btn-sec volver" id="btnVolver" href="../" aria-label="Volver a Internos" title="Volver a Internos">‹</a>
    <button class="btn-sec ic" id="btnInicio" aria-label="Inicio de la ficha" title="Inicio de la ficha" hidden>⌂</button>
    <img class="logo" src="../logo.png" alt="">
    <div class="marca">Ficha de ingreso<small>Alas de Libertad</small></div>
    <div class="sp"></div>
    <button class="btn-sec ic" id="btnMas" aria-label="Nueva ficha" title="Nueva ficha" hidden>＋</button>
    <button class="btn-sec" id="btnIndice">Preguntas</button>
    <button class="btn-sec" id="btnVer">Ver ficha</button>
  </header>
  <div class="nota no-print" id="nota" role="status" hidden></div>
  <main id="vista"></main>
</div>

<div class="panel no-print" id="panel">
  <div class="hoja">
    <div style="display:flex;align-items:center"><h3 style="flex:1">Todas las preguntas</h3><button class="btn-sec" id="cerrarPanel">Cerrar</button></div>
    <div id="indice"></div>
  </div>
</div>

    if(!b){ b={id:actual.id}; borradores.unshift(b); }
    b.D=D; b.paso=paso; b.upd=Date.now();
    localStorage.setItem(CLAVE_B, JSON.stringify(borradores));
  }catch(e){}
  try{ fsSubir(); }catch(e){}
}
function guardarLista(){ try{ localStorage.setItem(CLAVE_B, JSON.stringify(borradores)); }catch(e){} try{ fsSubir(); }catch(e){} }
function cargar(){
  try{ borradores = JSON.parse(localStorage.getItem(CLAVE_B)||"[]"); if(!Array.isArray(borradores)) borradores=[]; }catch(e){ borradores=[]; }
  borradores = borradores.filter(b=>b&&b.id&&!vacia(b.D));
  try{ // la ficha única de antes pasa a «Sin terminar» (si no estaba guardada)
    const r = JSON.parse(localStorage.getItem(CLAVE)||"null");
    if(r && r.D && !r.D._guardada && Object.keys(r.D).some(k=>!k.startsWith("_") && r.D[k]!=="" && r.D[k]!=null)){
      borradores.unshift({id:"b"+Date.now().toString(36),D:r.D,paso:r.paso||0,upd:Date.now()}); guardarLista(); }
    localStorage.removeItem(CLAVE);
  }catch(e){}
}
function pctDe(d){ const g=D; D=d||{}; const vs=Q.filter(visible); const n=vs.filter(q=>{const v=D[q.k]; return !(v==null||v===""||(Array.isArray(v)&&!v.length));}).length; D=g; return vs.length?Math.round(n/vs.length*100):0; }
function nuevaFicha(pref){
  if(actual&&actual.tipo==="bor"&&vacia(D)){ borradores=borradores.filter(b=>b.id!==actual.id); guardarLista(); }
  D=Object.assign({},pref||{}); paso=0; actual={tipo:"bor",id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
  modo="preguntas"; guardar(); nota(pref&&pref.nombre?"Ficha nueva de "+pref.nombre+": el nombre y la cédula ya están puestos.":""); render();
}
function seguir(b){ D=b.D||{}; paso=Math.min(b.paso||0,Q.length-1); actual={tipo:"bor",id:b.id}; modo="preguntas"; nota(""); render(); }
// Una ficha sin ninguna respuesta propia (solo las fechas que se ponen solas) no queda en «Sin terminar»
function vacia(d){ d=d||{}; return !Q.some(q=>{ if(q.def) return false; const v=d[q.k]; return !(v==null||v===""||(Array.isArray(v)&&!v.length)); }); }
function irInicio(){
  if(actual&&actual.tipo==="corr"){ try{ localStorage.removeItem(CLAVE_C); }catch(e){} }
  if(actual&&actual.tipo==="bor"&&vacia(D)){ borradores=borradores.filter(b=>b.id!==actual.id); guardarLista(); }
  actual=null; D={}; paso=0; modo="inicio"; nota(""); render();
}
function aplicarDefaults(q){
  if(q.def && (D[q.k]===undefined || D[q.k]==="")){
    const v = typeof q.def==="function" ? q.def(D) : q.def;
    if(v) D[q.k]=v;
  }
}
function visible(q){ return !q.si || q.si(D); }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtFecha(iso){ if(!iso) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m? m[3]+"/"+m[2]+"/"+m[1] : iso; }
function val(k){ const v=D[k]; if(Array.isArray(v)) return v; return (v==null?"":String(v)).trim(); }
function resumen(q){
  const v=D[q.k];
  if(v==null || v==="" || (Array.isArray(v)&&!v.length)) return "";
  if(q.tipo==="date") return fmtFecha(v);
  if(Array.isArray(v)) return v.join(", ");

}

/* ---------- Pantalla de preguntas ---------- */
function render(){
  const enFicha = modo==="preguntas"||modo==="ficha";
  $("#btnVolver").hidden = modo!=="inicio"; $("#btnInicio").hidden = modo==="inicio";
  $("#btnMas").hidden = modo==="inicio"; $("#btnIndice").hidden = !enFicha; $("#btnVer").hidden = !enFicha;
  $("#btnVer").textContent = modo!=="preguntas" ? "Volver" : "Ver ficha";
  if(actual&&actual.tipo==="corr"&&enFicha) nota("✏️ Corrigiendo la ficha guardada de "+(val("nombre")||"este residente")+". Tus fichas sin terminar no se tocan. Para no guardar cambios, tocá ⌂.");
  if(modo==="inicio") return renderInicio();
  if(modo==="ok") return renderOk();
  if(modo==="ficha") return renderFicha();
  if(modo==="lista") return renderLista();
  const q = Q[paso];
  aplicarDefaults(q);
  const visibles = Q.filter(visible);
  const pos = visibles.indexOf(q)+1;
  const v = D[q.k];
  let h = `<div class="barra"><i style="width:${Math.round(pos/visibles.length*100)}%"></i></div>
    <div class="seccion"><span>${esc(SECCIONES[q.s])}</span><span>${pos} de ${visibles.length}</span></div>
    <div class="card">
      <p class="pregunta">${esc(q.ask)}</p>
      <p class="etiqueta">En la ficha: ${esc(q.label)}</p>`;
  if(q.lectura){
    h += `<div class="lectura">Leerle al residente: <b>Declaración de conocimiento, consentimiento y aceptación del tratamiento</b>${DECLARACION.map(t=>`<p>${esc(t)}</p>`).join("")}<ul>${COMPROMISOS.map(c=>`<li>${esc(c)}</li>`).join("")}</ul><p>${esc(DECLARACION_FIN)}</p></div>`;
  }
  if(q.tipo==="choice" || q.tipo==="multi"){
    const sel = q.tipo==="multi" ? (Array.isArray(v)?v:[]) : [v];
    h += `<div class="opciones">` + q.ops.map((o,i)=>{
      const on = sel.includes(o);
      return `<button class="op ${on?"on":""}" data-op="${i}"><span class="cuad">${on?"✓":""}</span>${esc(o)}</button>`;
    }).join("") + `</div>`;
    if(q.otro && sel.includes("Otro")){
      h += `<div class="otro"><input type="text" id="otro" placeholder="Especificar…" value="${esc(D[q.otro]||"")}"></div>`;
    }
  } else if(q.tipo==="area"){
    h += `<textarea id="inp" placeholder="Escribí acá…">${esc(v||"")}</textarea>`;
  } else {
    const t = q.tipo==="text" ? "text" : q.tipo;
    h += `<input id="inp" type="${t}" ${q.num?'inputmode="numeric"':''} autocomplete="off" value="${esc(v||"")}" placeholder="${q.tipo==="date"?"":"Escribí acá…"}">`;
    if(q.chips) h += `<div class="chips">${q.chips.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  }
  if(q.hint) h += `<p class="hint">${esc(q.hint)}</p>`;
  const ultimo = siguienteIndice(paso)===-1;
  h += `<div class="nav">
      <button id="ant" ${anteriorIndice(paso)===-1?"disabled style='opacity:.4'":""}>Anterior</button>
      <button id="sig" class="sig">${ultimo?"Terminar y ver ficha":"Siguiente"}</button>
    </div>
    <button class="saltar" id="saltar">Dejar en blanco y seguir</button>
  </div>`;
  $("#vista").innerHTML = h;

  const inp = $("#inp");
  if(inp){
    inp.addEventListener("input", ()=>{ D[q.k]=inp.value; guardar(); });
    if(q.tipo!=="date") setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && q.tipo!=="area"){ e.preventDefault(); avanzar(); } });
  }
  document.querySelectorAll("[data-chip]").forEach(b=>b.addEventListener("click",()=>{
    D[q.k]=b.dataset.chip; guardar(); avanzar();
  }));
  document.querySelectorAll("[data-op]").forEach(b=>b.addEventListener("click",()=>{
    const o = q.ops[+b.dataset.op];
    if(q.tipo==="multi"){
      const arr = Array.isArray(D[q.k])?D[q.k].slice():[];
      const i = arr.indexOf(o); if(i>=0) arr.splice(i,1); else arr.push(o);
      D[q.k]=arr; guardar(); render();
    } else {
      D[q.k] = (D[q.k]===o) ? "" : o; guardar();
      if(D[q.k] && !(q.otro && o==="Otro")) avanzar(); else render();
    }
  }));
  const otro = $("#otro");
  if(otro){ otro.addEventListener("input",()=>{ D[q.otro]=otro.value; guardar(); }); setTimeout(()=>{ try{otro.focus({preventScroll:true});}catch(e){} },60); }
  $("#sig").addEventListener("click", avanzar);
  $("#ant").addEventListener("click", ()=>{ const i=anteriorIndice(paso); if(i>=0){ paso=i; guardar(); render(); } });
  $("#saltar").addEventListener("click", ()=>{ if(q.tipo!=="multi" && q.tipo!=="choice") D[q.k]=""; avanzar(); });
  window.scrollTo(0,0);
}
function siguienteIndice(i){ for(let j=i+1;j<Q.length;j++) if(visible(Q[j])) return j; return -1; }
function anteriorIndice(i){ for(let j=i-1;j>=0;j--) if(visible(Q[j])) return j; return -1; }
function avanzar(){
  const j = siguienteIndice(paso);
  if(j===-1){ modo="ficha"; guardar(); render(); return; }
  paso=j; guardar(); render();
}

function layout(medir){
  const ops=[];
  const txt=(p,x,y,s,str)=>ops.push({p,t:"text",x,y,s,str});
  const fld=(p,x,y,w,str,blanco)=>{
    if(!str) return;
    let s=11; while(s>6.5 && medir(str,s)>w) s-=0.5;
    if(blanco) ops.push({p,t:"rect",x:x-3,y:y-10,w:86,h:13});
    txt(p,x,y,s,str);
  };
  const envolver=(str,s,slots)=>{
    const pal=str.replace(/\s+/g," ").trim().split(" ");
    const out=[]; let i=0;
    for(const sl of slots){
      let l="";
      while(i<pal.length){
        const prueba = l? l+" "+pal[i] : pal[i];
        if(medir(prueba,s)<=sl[2]){ l=prueba; i++; } else break;
      }
      out.push(l);
      if(i>=pal.length) return out;
    }
    return null;
  };
  const area=(p,slots,str)=>{
    if(!str) return;
    let lineas=null, s=11;
    for(s=11;s>=6;s-=0.5){ lineas=envolver(str,s,slots); if(lineas) break; }
    if(!lineas){ s=6; lineas=envolver(str.slice(0,300),6,slots)||[str.slice(0,110)]; }
    lineas.forEach((l,i)=>{ if(l) txt(p,slots[i][0],slots[i][1],s,l); });
  };
  const box=(p,x,y,on)=>{ if(on) ops.push({p,t:"x",cx:x+4.9,cy:y+8.4}); };
  const F=k=>fmtFecha(val(k));

  // Página 1
  fld(1,431,121.6,80,F("fecha"));
  fld(1,298,235.8,210,F("fechaIngreso"));
  fld(1,218,320.9,292,val("nombre"));
  fld(1,224,334.7,286,val("cedula"));
  fld(1,227,348.5,283,F("nacimiento"));
  fld(1,192,362.3,318,val("nacionalidad"));
  fld(1,185,376.1,325,val("estadoCivil"));
  fld(1,260,389.9,250,val("domicilio"));
  fld(1,229,403.7,281,val("telefono"));
  fld(1,266,414.6,244,val("correo"));
  fld(1,218,502.7,292,val("refNombre"));
  fld(1,245,516.6,265,val("refVinculo"));
  fld(1,172,530.4,338,val("refTelefono"));
  fld(1,176,544.6,334,val("refDireccion"));
  fld(1,315,587.9,195,val("institucion"));
  fld(1,236,601.7,274,val("tiempoInternacion"));
  fld(1,205,615.5,305,F("fechaEgreso"));
  const tt=Array.isArray(D.tipoTrat)?D.tipoTrat:[];
  box(1,121,645.8,tt.includes("Comunidad terapéutica"));
  box(1,121,675.2,tt.includes("Centro de rehabilitación"));
  // Página 2
  box(2,121,69.9,tt.includes("Hospital"));
  box(2,121,99.5,tt.includes("Otro"));
  if(tt.includes("Otro")) fld(2,227,109.8,283,val("tipoTratOtro"));
  area(2,[[311,140.4,199],[121,151.2,389]],val("diagnostico"));
  fld(2,352,168.0,158,val("abstinencia"));
  box(2,121,269.6,D.cronicas==="Sí"); box(2,147.4,269.6,D.cronicas==="No");
  if(D.cronicas==="Sí") area(2,[[278,310.8,232],[121,324,389],[121,337,389]],val("cronicasDetalle"));
  box(2,121,368.9,D.tratMedico==="Sí"); box(2,147.4,368.9,D.tratMedico==="No");
  area(2,[[300,410.2,210],[121,421.2,389],[121,436.6,389]],val("medicacion"));
  fld(2,328,451.8,182, D.prestador==="Otro" ? ("Otro"+(val("prestadorOtro")?": "+val("prestadorOtro"):"")) : val("prestador"));
  area(2,[[284,479.4,226],[121,490.4,389]],val("medico"));
  [121,167.9,220.7,266.8].forEach((x,i)=>box(2,x,594.6,D.convivencia===["Solo/a","Familia","Pareja","Otro"][i]));
  if(D.convivencia==="Otro") fld(2,309,607.7,201,val("convivenciaOtro"));
  [121,168.7,222.7,272.3].forEach((x,i)=>box(2,x,652.7,D.vinculoFam===["Bueno","Regular","Escaso","Inexistente"][i]));
  area(2,[[253,707.8,257],[121,721.6,389],[121,732.8,389]],val("redApoyo"));
  // Página 3
  [121,178.4,248,307.4].forEach((x,i)=>box(3,x,155.1,D.nivel===["Primaria","Secundaria","Terciaria","Universitaria"][i]));
  box(3,386.2,155.1,D.nivelInc==="Incompleto");
  [121,211,284.6,382.5].forEach((x,i)=>box(3,x,226.7,D.laboral===["Desempleado/a","Empleado/a","Trabajo informal","Estudiante"][i]));
  area(3,[[262,281.8,248],[121,296,389],[121,310,389],[121,324,389]],val("oficio"));
  box(3,84.6,644.0,D.compromiso==="Acepta"); box(3,136.0,644.0,D.compromiso==="No acepta");
  // Página 4
  area(4,[[85,131,425],[85,144,425],[85,157,425],[85,170,425],[85,182.5,425]],val("observaciones"));
  return ops;
}

/* ---------- Vista en pantalla (dibuja sobre la ficha original) ---------- */
const PW=595.56, PH=842.04;
const imgs={};
function cargarImg(i){
  if(imgs[i]) return imgs[i];
  imgs[i]=new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=FONDOS[i-1]; });
  return imgs[i];
}
const FUENTE_CANVAS = s => `bold ${s}px "Times New Roman", Times, "Liberation Serif", "Nimbus Roman", serif`;
async function dibujarPaginas(cont){
  const lienzos=[];
  for(let i=1;i<=4;i++){
    const c=document.createElement("canvas"); c.className="hoja-ficha"; cont.appendChild(c); lienzos.push(c);
  }
  const ctxM=document.createElement("canvas").getContext("2d");
  const medir=(str,s)=>{ ctxM.font=FUENTE_CANVAS(s); return ctxM.measureText(str).width; };
  const ops=layout(medir);
  for(let i=1;i<=4;i++){
    const im=await cargarImg(i); const c=lienzos[i-1];
    const W=im?im.naturalWidth:1241, H=im?im.naturalHeight:1754, S=W/PW;
    c.width=W; c.height=H;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    if(im) ctx.drawImage(im,0,0,W,H);
    ops.filter(o=>o.p===i).forEach(o=>{
      if(o.t==="rect"){ ctx.fillStyle="#fff"; ctx.fillRect(o.x*S,o.y*S,o.w*S,o.h*S); }
      else if(o.t==="text"){ ctx.fillStyle="#111"; ctx.font=FUENTE_CANVAS(o.s*S); ctx.fillText(o.str,o.x*S,o.y*S); }
      else if(o.t==="x"){ ctx.strokeStyle="#111"; ctx.lineWidth=1.3*S; ctx.lineCap="round"; const d=3.1*S, cx=o.cx*S, cy=o.cy*S;
        ctx.beginPath(); ctx.moveTo(cx-d,cy-d); ctx.lineTo(cx+d,cy+d); ctx.moveTo(cx+d,cy-d); ctx.lineTo(cx-d,cy+d); ctx.stroke(); }
    });
  }
}

function aviso(t){ const m=$("#msg"); if(!m) return; m.textContent=t; m.classList.add("show"); }

/* ---------- PDF ---------- */
function armarPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:[PW,PH]});
  doc.setFont("times","bold");
  const medir=(str,s)=>{ doc.setFontSize(s); return doc.getTextWidth(str); };
  const ops=layout(medir);
  for(let i=1;i<=4;i++){
    if(i>1) doc.addPage([PW,PH]);
    doc.addImage(FONDOS[i-1],"JPEG",0,0,PW,PH);
    ops.filter(o=>o.p===i).forEach(o=>{
      if(o.t==="rect"){ doc.setFillColor(255,255,255); doc.rect(o.x,o.y,o.w,o.h,"F"); }
      else if(o.t==="text"){ doc.setTextColor(17,17,17); doc.setFont("times","bold"); doc.setFontSize(o.s); doc.text(o.str,o.x,o.y); }
      else if(o.t==="x"){ doc.setDrawColor(17,17,17); doc.setLineWidth(1.3); doc.setLineCap("round"); const d=3.1;
        doc.line(o.cx-d,o.cy-d,o.cx+d,o.cy+d); doc.line(o.cx+d,o.cy-d,o.cx-d,o.cy+d); }
    });
  }
  return doc;
}

async function descargarPDF(){
  if(!window.jspdf){ aviso("No se pudo cargar el generador de PDF. Revisá la conexión y recargá la página."); return; }
  let doc;
  try{ doc = armarPDF(); }catch(e){ aviso("Hubo un error armando el PDF: "+e.message); return; }
  const nombre = (val("nombre")||"residente").replace(/[^\wÁÉÍÓÚáéíóúÑñ ]+/g,"").trim().replace(/\s+/g,"_");
  const archivo = "Ficha_ingreso_"+nombre+".pdf";
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl=null; }
  if(dl){
    try{
      await dl.save({filename:archivo, data:doc.output("arraybuffer")});
      aviso("Listo. El PDF quedó descargado: abrilo y mandalo a imprimir.");
    }catch(e){
      if(e && e.code==="declined") aviso("Descarga cancelada.");
      else aviso("No se pudo descargar acá ("+(e&&e.code||"error")+"). Probá abrir esta página desde claude.ai en la computadora.");
    }
  } else {
    try{ doc.save(archivo); aviso("Listo. El PDF quedó en Descargas: abrilo y mandalo a imprimir."); }
    catch(e){ aviso("No se pudo descargar el PDF: "+e.message); }
  }
}

function sesion(){ try{ const p=JSON.parse(sessionStorage.getItem("alas-paso")||"null"); if(p&&p.token) return p; return JSON.parse(localStorage.getItem("alas-token")||"null"); }catch(e){ return null; } }
/* Google a veces deja un pedido colgado y nunca llega: los pedidos que se pueden repetir sin problema
   (leer, ver usuario, actualizar) se cortan a los pocos segundos y se vuelven a mandar solos. */
const REPETIBLE=a=>/^(get|check|list)/i.test(a||"")||["updateRow","updateInterno","marcarMed","setSheet","inicio"].includes(a);
async function postGoogle(url,datos){
  const body=JSON.stringify(datos),esperas=REPETIBLE(datos.action)?[7000,8000,9000,10000,12000]:[0];let err;
  for(const ms of esperas){
    const ctl=ms?new AbortController():null,tm=ms?setTimeout(()=>ctl.abort(),ms):0;
    try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body,signal:ctl?ctl.signal:undefined});
      const t=await r.text();clearTimeout(tm);return {r,t}}
    catch(e){clearTimeout(tm);err=e.name==="AbortError"?new Error("Google no contestó"):e}
  }
  throw err;
}
async function api(o){
  const s=sesion(); if(!s||!s.token) throw new Error("para guardar o ver fichas, entrá a la ficha desde la app de Internos (Más → Ficha de ingreso)");
  const {t}=await postGoogle(API,Object.assign({email:s.email,token:s.token},o)); let j; try{ j=JSON.parse(t); }catch(e){ throw new Error("la planilla no respondió bien, probá de nuevo"); }
  if(j && j.auth===false) throw new Error("tu sesión venció: volvé a Internos y entrá de nuevo");
  return j;
}
async function leerFichas(){
  const r=await api({action:"getSheet",sheet:HOJA});
  if(!r||r.ok!==true) throw new Error((r&&r.error)||"no se pudo leer");
  return (r.data||[]).map(o=>{ let d={}; try{ d=JSON.parse(o.datos||"{}"); }catch(e){}
    return {fila:o._fila,id:String(o.id||""),nombre:String(o.nombre||"").trim(),cedula:String(o.cedula||""),fecha:String(o.fechadeingreso||"").slice(0,10),por:String(o.guardadapor||""),act:String(o.actualizada||""),D:d}; })
    .filter(f=>f.id&&f.nombre);
}
function ahoraTxt(){ const d=new Date(),z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes()); }
// Al guardar una ficha nueva, el residente se agrega solo a la lista de Internos (si no estaba)
async function agregarAInternos(){
  const ins=await api({action:"getInternos"}); const arr=Array.isArray(ins)?ins:(ins&&ins.data)||[];
  if(ins&&ins.ok===false) throw new Error(ins.error||"no se pudo leer Internos");
  const c=nced(val("cedula")), n=norm(val("nombre")).replace(/\s+/g," ").trim();
  const ya=arr.find(i=>(c&&nced(i.cedula)===c)||(!c&&norm(i.nombre).replace(/\s+/g," ").trim()===n));
  if(ya){ D._interno=String(ya.id||"ya"); return "ya"; }
  if(!val("tipoIng")) throw new Error("falta elegir si ingresa como Privado o MIDES: elegilo arriba del botón Guardar y tocá Guardar de nuevo");
  const rec={nombre:val("nombre"),cedula:val("cedula"),ingreso:val("fechaIngreso")||val("fecha"),tipo:val("tipoIng")};
  const r=await api({action:"addInterno",record:rec});
  if(!r||r.ok!==true) throw new Error((r&&r.error)||"no se confirmó");
  D._interno=String(r.id||"nuevo"); return "nuevo";
}
async function guardarFicha(btn){
  if(!val("nombre")){ aviso("Falta el nombre del residente: volvé a las preguntas y completalo."); return; }
  btn.disabled=true; btn.textContent="Guardando…";
  try{
    if(!D._id) D._id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const s=sesion()||{}, cuando=ahoraTxt();
    const datos=Object.assign({},D); delete datos._guardada;
    const rec={"id":D._id,"Fecha de ingreso":val("fechaIngreso")||val("fecha"),"Nombre":val("nombre"),"Cédula":val("cedula"),"Guardada por":s.email||"","Actualizada":cuando,"Datos":JSON.stringify(datos)};
    const ya=(await leerFichas()).find(f=>f.id===D._id);
    const r= ya ? await api({action:"updateRow",sheet:HOJA,fila:ya.fila,record:rec,log:"Corrigió la ficha de ingreso de "+rec["Nombre"]})
                : await api({action:"addRow",sheet:HOJA,record:rec,log:"Guardó la ficha de ingreso de "+rec["Nombre"]});
    if(!r||r.ok!==true) throw new Error((r&&r.error)||"no se confirmó");
    D._guardada=cuando; guardar();
    let extra="";
    if(!D._interno){
      try{ const q=await agregarAInternos(); guardar();
        extra = q==="nuevo" ? " "+rec["Nombre"].split(" ")[0]+" ya quedó agregado a la lista de Internos ("+val("tipoIng")+", ingreso "+fmtFecha(val("fechaIngreso")||val("fecha"))+")." : " Ya estaba en la lista de Internos.";
      }catch(e){ extra=" ⚠ Pero no se agregó a Internos: "+e.message+"."; }
    }
    const eraCorr = actual&&actual.tipo==="corr";
    if(eraCorr){ try{ localStorage.removeItem(CLAVE_C); }catch(e){} }
    else if(actual){ borradores=borradores.filter(b=>b.id!==actual.id); guardarLista(); }
    okInfo={nombre:rec["Nombre"], corr:eraCorr, extra:extra.trim(), datos:Object.assign({},D)};
    actual=null; modo="ok"; nota(""); render();
  }catch(e){ btn.disabled=false; btn.textContent=D._guardada?"💾 Guardar cambios":"💾 Guardar ficha"; aviso("No se pudo guardar: "+e.message); }
}
// Abre una ficha guardada aparte (no toca las fichas sin terminar)
function abrirGuardada(f){
  D=Object.assign({},f.D,{_id:f.id,_guardada:f.act||"sí"}); paso=0; actual={tipo:"corr"}; modo="ficha"; guardar(); render();
}
async function abrirPorCedula(ced,nom){
  $("#vista").innerHTML='<p class="hint" style="margin-top:20px">Buscando la ficha de '+esc(nom||ced)+'…</p>';
  try{
    const c=nced(ced); const ls=c?(await leerFichas()).filter(f=>nced(f.cedula)===c).sort((a,b)=>(b.act).localeCompare(a.act)):[];
    if(ls.length){ abrirGuardada(ls[0]); return; }
    const b=c&&borradores.find(x=>nced(x.D&&x.D.cedula)===c);
    if(b){ seguir(b); nota((nom||"Este interno")+" tiene una ficha sin terminar: seguís desde donde quedó."); return; }
    nuevaFicha({nombre:nom,cedula:ced}); nota((nom||"Este interno")+" todavía no tiene ficha guardada. Empezá una: el nombre y la cédula ya están puestos.");
  }catch(e){ nota("No se pudo buscar la ficha: "+e.message); modo="inicio"; render(); }
}
function renderInicio(){
  borradores.sort((a,b)=>(b.upd||0)-(a.upd||0));
  let corr=null; try{ corr=JSON.parse(localStorage.getItem(CLAVE_C)||"null"); }catch(e){}
  $("#vista").innerHTML=`<div class="inicio">
    <h2>¿Qué querés hacer?</h2>
    <button type="button" class="big main" id="iNueva"><span class="bi">＋</span><span><b>Nueva ficha</b><small>Empieza vacía, siempre</small></span></button>
    ${corr&&corr.D?`<div class="isec">Corrección sin guardar</div>
      <div class="draft"><span class="av">${esc(inic(corr.D.nombre))}</span><button type="button" class="tx" id="iCorr"><b>${esc(corr.D.nombre||"Sin nombre")}</b><small>✏️ Estabas corrigiendo su ficha guardada · tocá para seguir</small></button><button type="button" class="x" id="iCorrX" aria-label="Descartar la corrección">✕</button></div>`:""}
    ${borradores.length?`<div class="isec">Sin terminar · ${borradores.length}</div>`+borradores.map(b=>{const p=pctDe(b.D);return `<div class="draft"><span class="av">${esc(inic(b.D&&b.D.nombre)||"?")}</span><button type="button" class="tx" data-id="${esc(b.id)}"><b>${esc((b.D&&b.D.nombre)||"Sin nombre todavía")}</b><small>${p}% hecha · tocá para seguir</small><span class="bar"><i style="width:${p}%"></i></span></button><button type="button" class="x" data-x="${esc(b.id)}" aria-label="Descartar la ficha de ${esc((b.D&&b.D.nombre)||"sin nombre")}">✕</button></div>`}).join(""):""}
    <button type="button" class="big" id="iGuard"><span class="bi">🗂</span><span><b>Fichas guardadas</b><small>Ver, imprimir o corregir</small></span></button>
  </div>`;
  $("#iNueva").onclick=()=>nuevaFicha();
  $("#iGuard").onclick=()=>{ modo="lista"; render(); };
  if($("#iCorr")){ $("#iCorr").onclick=()=>{ D=corr.D; paso=Math.min(corr.paso||0,Q.length-1); actual={tipo:"corr"}; modo="ficha"; render(); };
    $("#iCorrX").onclick=()=>{ if(confirm("¿Descartar los cambios sin guardar de la ficha de "+(corr.D.nombre||"este residente")+"? La ficha guardada queda como estaba.")){ try{localStorage.removeItem(CLAVE_C);}catch(e){} render(); } }; }
  document.querySelectorAll(".draft .tx[data-id]").forEach(t=>t.onclick=()=>seguir(borradores.find(b=>b.id===t.dataset.id)));
  document.querySelectorAll(".draft .x[data-x]").forEach(x=>x.onclick=()=>{ const b=borradores.find(z=>z.id===x.dataset.x);
    if(confirm("¿Descartar la ficha de "+((b.D&&b.D.nombre)||"sin nombre")+"? Se borra lo que tenía y no se puede recuperar.")){ borradores=borradores.filter(z=>z!==b); guardarLista(); render(); } });
  window.scrollTo(0,0);
}
function renderOk(){
  const o=okInfo||{nombre:""};
  $("#vista").innerHTML=`<div class="inicio">
    <div class="okbox"><span>✔</span><b>${o.corr?"Cambios guardados":"Ficha de "+esc(String(o.nombre).split(" ")[0])+" guardada"}</b>
      <span>${o.corr?"Se actualizó la misma ficha, no se duplicó.":esc(o.extra||"Salió de «Sin terminar».")}</span></div>
    <button type="button" class="big" id="oVer"><span class="bi">🖨</span><span><b>Ver e imprimir</b><small>Descargar el PDF de esta ficha</small></span></button>
    <button type="button" class="big main" id="oNueva"><span class="bi">＋</span><span><b>Nueva ficha</b><small>Empieza vacía</small></span></button>
    <button type="button" class="big" id="oInicio"><span class="bi">⌂</span><span><b>Volver al inicio</b></span></button>
  </div>`;
  $("#oVer").onclick=()=>{ D=Object.assign({},o.datos); paso=0; actual={tipo:"corr"}; modo="ficha"; guardar(); render(); };
  $("#oNueva").onclick=()=>nuevaFicha();
  $("#oInicio").onclick=irInicio;
  window.scrollTo(0,0);
}
async function renderLista(){
  nota("");
  $("#vista").innerHTML=`<div class="lista"><h2>Fichas guardadas</h2>
    <div class="busca"><input id="lq" type="search" placeholder="Buscar por nombre o cédula…" aria-label="Buscar ficha" autocomplete="off"></div>
    <p class="cnt" id="lcnt">Cargando…</p><div id="lfichas"></div></div>`;
  window.scrollTo(0,0);
  let fichas, act=null;
  try{
    fichas=await leerFichas();
    try{ const ins=await api({action:"getInternos"}); const arr=Array.isArray(ins)?ins:(ins&&ins.data)||null; if(arr) act=new Set(arr.map(i=>nced(i.cedula)).filter(Boolean)); }catch(e){}
  }catch(e){ if(modo==="lista") $("#lcnt").textContent="No se pudo cargar: "+e.message; return; }
  if(modo!=="lista") return;
  fichas.sort((a,b)=>(b.fecha+b.act).localeCompare(a.fecha+a.act));
  const pintar=()=>{ const q=norm($("#lq").value.trim());
    const ls=fichas.filter(f=>!q||norm(f.nombre+" "+f.cedula+" "+nced(f.cedula)).includes(q));
    $("#lcnt").textContent = !fichas.length ? "Todavía no hay fichas guardadas. Al terminar una ficha, tocá «Guardar ficha»."
      : ls.length+(ls.length===1?" ficha":" fichas")+" · la más nueva primero";
    $("#lfichas").innerHTML = ls.map(f=>`<button type="button" class="lrow" data-id="${esc(f.id)}"><span class="av">${esc(inic(f.nombre))}</span><span class="lt2"><b>${esc(f.nombre)}${act&&f.cedula&&!act.has(nced(f.cedula))?"<em>Ya no está</em>":""}</b><small>Ingreso ${esc(fmtFecha(f.fecha))}${f.cedula?" · "+esc(f.cedula):""}</small></span><i>›</i></button>`).join("")
      || (fichas.length?'<p class="cnt">Nadie coincide con la búsqueda.</p>':"");
    document.querySelectorAll(".lrow").forEach(b=>b.onclick=()=>abrirGuardada(fichas.find(f=>f.id===b.dataset.id)));
  };
  $("#lq").oninput=pintar; pintar();
}

/* ---------- Fichas sin terminar compartidas entre celulares (base en tiempo real) ----------
   Cada ficha a medias se guarda también en la base: se puede seguir desde otro celular.
   Cuando se guarda o se descarta, se avisa a la base para que desaparezca en todos. */
const FB_CONF={apiKey:"AIzaSyC3mDOcJqIa4HfMOCsCQod2tbi30zkmUUs",authDomain:"alas-de-libertad.firebaseapp.com",projectId:"alas-de-libertad",storageBucket:"alas-de-libertad.firebasestorage.app",messagingSenderId:"39658390390",appId:"1:39658390390:web:4cfb1fdc7a29b26b0eb057"};
const FB_JS="https://www.gstatic.com/firebasejs/10.12.2/";
const _js={};function cargarJS(u){return _js[u]||(_js[u]=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=u;sc.onload=ok;sc.onerror=()=>{delete _js[u];no(new Error("no se pudo cargar Firebase"))};document.head.append(sc)}))}
const FSB={db:null,uid:"",listo:null,unsub:null,subido:{},t:null,oido:false};
function fsIniciar(){if(FSB.listo)return FSB.listo;
  FSB.listo=(async()=>{await cargarJS(FB_JS+"firebase-app-compat.js");await cargarJS(FB_JS+"firebase-auth-compat.js");await cargarJS(FB_JS+"firebase-firestore-compat.js");
    if(!firebase.apps.length)firebase.initializeApp(FB_CONF);const db=firebase.firestore();
    if(localStorage.getItem("alas-token")){try{await db.enablePersistence({synchronizeTabs:true})}catch(x){}}
    const au=firebase.auth();await new Promise(r=>{const u=au.onAuthStateChanged(()=>{u();r()})});if(!au.currentUser)await au.signInAnonymously();
    FSB.uid=au.currentUser.uid;FSB.db=db;return db})().catch(e=>{FSB.listo=null;throw e});return FSB.listo}
async function fsAcceso(forzar){const se=sesion()||{},k="alas-fs-acc",marca=se.email+"|"+FSB.uid;let v="";try{v=localStorage.getItem(k)||sessionStorage.getItem(k)||""}catch(x){}
  if(!forzar&&v.startsWith(marca+"|")&&Date.now()-Number(v.split("|")[2])<864e5)return;
  const r=await api({action:"fbAcceso",uid:FSB.uid});if(!r||r.ok!==true)throw new Error((r&&r.error)||"sin acceso a la base");
  try{(localStorage.getItem("alas-token")?localStorage:sessionStorage).setItem(k,marca+"|"+Date.now())}catch(x){}}
function fsSubir(){clearTimeout(FSB.t);FSB.t=setTimeout(fsSubirYa,1500)}
function fsSubirYa(){if(!FSB.db||!FSB.oido)return;const se=sesion()||{},col=FSB.db.collection("borradores"),vivos=new Set();
  borradores.forEach(b=>{if(vacia(b.D))return;vivos.add(b.id);if(FSB.subido[b.id]===b.upd)return;FSB.subido[b.id]=b.upd;
    col.doc(b.id).set({D:JSON.stringify(b.D||{}),paso:b.paso||0,upd:b.upd||Date.now(),por:se.email||""}).catch(()=>{delete FSB.subido[b.id]})});
  Object.keys(FSB.subido).forEach(id=>{if(!vivos.has(id)&&FSB.subido[id]!=="x"){FSB.subido[id]="x";col.doc(id).set({borrado:true,upd:Date.now()}).catch(()=>{})}})}
async function fsEscuchar(){const se=sesion();if(FSB.unsub||fsEscuchar.p||!se||!se.token)return;fsEscuchar.p=1;
  try{await fsIniciar();await fsAcceso(false)}catch(e){fsEscuchar.p=0;return}
  let reintento=false;
  const c=()=>{FSB.unsub=FSB.db.collection("borradores").onSnapshot(q=>{let cambio=false;
      q.docs.forEach(d=>{const o=d.data()||{},id=d.id,loc=borradores.find(b=>b.id===id),editando=actual&&actual.tipo==="bor"&&actual.id===id;
        if(o.borrado){FSB.subido[id]="x";if(loc&&!editando&&(loc.upd||0)<=(o.upd||0)){borradores=borradores.filter(b=>b!==loc);cambio=true}return}
        if(editando)return;
        if(!loc||(loc.upd||0)<(o.upd||0)){let D2={};try{D2=JSON.parse(o.D||"{}")}catch(e){}
          if(vacia(D2))return;
          if(loc){loc.D=D2;loc.paso=o.paso||0;loc.upd=o.upd}else borradores.push({id,D:D2,paso:o.paso||0,upd:o.upd});cambio=true}
        if(!loc||(loc.upd||0)<=(o.upd||0))FSB.subido[id]=o.upd});
      FSB.oido=true;
      if(cambio){try{localStorage.setItem(CLAVE_B,JSON.stringify(borradores))}catch(e){}if(modo==="inicio")render()}
      fsSubir()},
    async e=>{FSB.unsub=null;if(!reintento&&e&&e.code==="permission-denied"){reintento=true;try{await fsAcceso(true);c()}catch(x){}}})};
  c();fsEscuchar.p=0}
setInterval(()=>{if(document.visibilityState==="visible")fsEscuchar()},20000);
setTimeout(fsEscuchar,500);
cargar();
{ let A=null; try{ A=JSON.parse(sessionStorage.getItem("ficha-abrir")||"null"); sessionStorage.removeItem("ficha-abrir"); }catch(e){}
  if(A&&(A.ced||A.nom)) abrirPorCedula(A.ced||"",A.nom||""); else render(); }
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
